<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Admin Portal - Login</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --sidebar-bg: #111827;
            --brand-primary: #4f46e5;
            --brand-hover: #4338ca;
            --bg-main: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9ca3af; /* Default Gray */
        }

        .status-dot.connected {
            background-color: #10b981; /* Green */
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .status-dot.disconnected {
            background-color: #ef4444; /* Red */
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sidebar-bg); /* Dark blue/black from your sidebar */
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--brand-primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: var(--brand-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-button:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
        }

        #admin-notice {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 8px;
            color: #be123c;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>BOM Portal</h2>
            <p>Enter your credentials to access the system</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-footer">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember Me
                </label>
                <span class="forgot-link" onclick="toggleNotice()">Forgot Password?</span>
            </div>

            <button type="submit" class="login-button">Sign In</button>
        </form>

        <div class="connection-status">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Checking Connection...</span>
        </div>

        <div id="admin-notice">
            <i class="fas fa-user-shield" style="margin-bottom: 5px; font-size: 16px;"></i><br>
            <strong>Access Restricted</strong><br>
            Please contact the system administrator to change or reset your password credentials.
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ontnxseisucgdofovrre.supabase.co';
        const supabaseKey = 'sb_publishable_PIJdCQKXj8lJqicuJeBk2Q_vCRvJBGL';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginForm = document.getElementById('loginForm');
        const notice = document.getElementById('admin-notice');

        // Function to check Supabase connection
        // Function to check Supabase connection via a real network ping
        async function checkConnection() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            // First check: Is the browser even online?
            if (!navigator.onLine) {
                updateStatus(false);
                return;
            }

            try {
                // We fetch a health check or a small piece of data to force a network request
                // Using a timeout to ensure it doesn't hang forever if the net is "zombie"
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const { data, error } = await _supabase.from('profiles').select('count', { count: 'planned', head: true }).limit(1).abortSignal(controller.signal);
                
                clearTimeout(timeoutId);
                updateStatus(true);
            } catch (err) {
                updateStatus(false);
            }
        }

        function updateStatus(isConnected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            if (isConnected) {
                dot.className = 'status-dot connected';
                text.innerText = 'Connected';
                text.style.color = '#10b981';
            } else {
                dot.className = 'status-dot disconnected';
                text.innerText = 'Disconnected';
                text.style.color = '#ef4444';
            }
        }

        // 1. Check on load
        checkConnection();

        // 2. Listen for browser losing/gaining internet
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', () => updateStatus(false));

        // 3. (Optional) Heartbeat: Check every 30 seconds
        setInterval(checkConnection, 30000);

        function toggleNotice() {
            notice.style.display = notice.style.display === 'block' ? 'none' : 'block';
        }

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginButton = e.target.querySelector('button');

            // Visual feedback
            loginButton.innerText = "Authenticating...";
            loginButton.style.opacity = "0.7";
            loginButton.disabled = true;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Login Error: " + error.message);
                loginButton.innerText = "Sign In";
                loginButton.style.opacity = "1";
                loginButton.disabled = false;
            } else {
                // Successful login
                window.location.href = 'dashboard.html'; 
            }
        };
    </script>
</body>
</html>
